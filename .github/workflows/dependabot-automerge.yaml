name: Dependabot Auto-Merge

# Thin caller of the org-wide reusable workflow. Approves + enables auto-merge
# for patch/minor bumps; comments + labels `needs-manual-review` for major.
# Must live at this path so the `dependabot-automerge` ruleset's required
# workflow check is produced for Dependabot PRs.

on:
  pull_request_target:
    types: [opened, synchronize]
    branches: [develop]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-merge:
    # Defence in depth: the reusable workflow already gates its steps on the
    # Dependabot actor, but guard the caller too so inherited secrets are never
    # passed to the reusable workflow for non-Dependabot (incl. fork) PRs.
    if: ${{ github.actor == 'dependabot[bot]' }}
    uses: realrate/.github/.github/workflows/dependabot-automerge.yaml@main
    secrets: inherit
