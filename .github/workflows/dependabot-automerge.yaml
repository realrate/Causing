name: Dependabot Auto-Merge

# Thin caller of the org-wide reusable workflow. Approves + enables auto-merge
# for patch/minor bumps; comments + labels `needs-manual-review` for major.
# Must live at this path so the `dependabot-automerge` ruleset's required
# workflow check is produced for Dependabot PRs.

on:
  pull_request_target:
    types: [opened, synchronize]
    branches: [develop]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-merge:
    # Guard on the PR *author*, not github.actor: github.actor is the user who
    # triggered the event and can be a maintainer on a rebase/synchronize of the
    # Dependabot branch, which would wrongly skip the job. The author can't be
    # forged, so this still keeps inherited secrets away from non-Dependabot
    # (incl. fork) PRs while running for every Dependabot-authored PR.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    uses: realrate/.github/.github/workflows/dependabot-automerge.yaml@main
    secrets: inherit
